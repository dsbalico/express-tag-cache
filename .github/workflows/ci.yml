name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    name: node ${{ matrix.node-version }} (${{ matrix.peers }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24", "26"]
        peers: ["default"]
        include:
          # Other supported peer versions, on the current LTS. A distinct `peers` value makes each
          # entry its own job instead of being merged into the default Node 24 job.
          - node-version: "24"
            peers: "redis@4 express@4"
          - node-version: "24"
            peers: "redis@6"

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install peer versions under test
        if: matrix.peers != 'default'
        run: npm install --no-save ${{ matrix.peers }}

      - name: Type-check
        if: matrix.peers == 'default'
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build
