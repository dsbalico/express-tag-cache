name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    name: node ${{ matrix.node-version }}${{ matrix.redis && format(' / redis {0}', matrix.redis) || '' }}${{ matrix.express && format(' / express {0}', matrix.express) || '' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24", "26"]
        include:
          # Other supported peer versions, on the current LTS.
          - node-version: "24"
            redis: "4"
            express: "4"
          - node-version: "24"
            redis: "6"

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install peer versions under test
        if: matrix.redis || matrix.express
        run: npm install --no-save ${{ matrix.redis && format('redis@{0}', matrix.redis) || '' }} ${{ matrix.express && format('express@{0}', matrix.express) || '' }}

      - name: Type-check
        if: ${{ !matrix.redis && !matrix.express }}
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build
